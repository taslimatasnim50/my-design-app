<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PixelLab Mobile Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Hind Siliguri', sans-serif; background: #18191a; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* টপ বার */
.topbar { height: 48px; background: #242526; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #3a3b3c; z-index: 10; }
.topbar h1 { font-size: 15px; font-weight: 600; color: #e4e6eb; }
.topbar-actions { display: flex; gap: 8px; }
.icon-btn { background: #3a3b3c; border: none; color: #e4e6eb; font-size: 15px; padding: 6px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: inherit; }
.icon-btn:active { background: #4e4f50; }
.btn-save { background: #2e7d32; color: white; }

/* ক্যানভাস এরিয়া */
.canvas-wrapper { flex: 1; position: relative; background: #121212; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
#mainCanvas { max-width: 100%; max-height: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.6); background: #ffffff; }

/* অপশন ড্রয়ার/প্যানেল */
.panel-drawer { height: 210px; background: #242526; border-top: 1px solid #3a3b3c; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; display: none; }
.panel-drawer.active { display: block; }
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #3a3b3c; font-size: 13px; font-weight: 600; color: #2e89ff; }
.close-panel { background: none; border: none; color: #b0b3b8; font-size: 18px; cursor: pointer; }

.ctrl-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.ctrl-row label { font-size: 12px; color: #b0b3b8; min-width: 75px; }
.ctrl-row input[type="text"], .ctrl-row textarea, .ctrl-row select { flex: 1; background: #3a3b3c; border: 1px solid #4e4f50; color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 12px; font-family: inherit; outline: none; }
.ctrl-row input[type="range"] { flex: 1; accent-color: #2e89ff; }
.ctrl-row input[type="color"] { width: 35px; height: 30px; border: none; border-radius: 4px; background: none; cursor: pointer; }
.ctrl-row input[type="number"] { width: 60px; background: #3a3b3c; border: 1px solid #4e4f50; color: #fff; padding: 5px; border-radius: 6px; font-size: 12px; }

.btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.action-btn { background: #3a3b3c; border: 1px solid #4e4f50; color: #e4e6eb; padding: 7px 4px; font-size: 11px; border-radius: 6px; cursor: pointer; text-align: center; font-family: inherit; }
.action-btn.active { background: #2e89ff; border-color: #2e89ff; color: #fff; }

/* বটম টুলবার */
.bottom-tabs { height: 55px; background: #1c1e21; display: flex; border-top: 1px solid #3a3b3c; z-index: 10; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #b0b3b8; cursor: pointer; font-size: 11px; gap: 2px; }
.tab-item.active { color: #2e89ff; }
.tab-icon { font-size: 16px; font-weight: bold; }

/* লেয়ার পপআপ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; align-items: center; justify-content: center; padding: 15px; }
.modal-overlay.open { display: flex; }
.modal-box { background: #242526; width: 100%; max-width: 360px; border-radius: 10px; border: 1px solid #3a3b3c; padding: 14px; max-height: 80vh; display: flex; flex-direction: column; }
.modal-header { font-size: 14px; font-weight: 600; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #3a3b3c; display: flex; justify-content: space-between; }
.layer-list { overflow-y: auto; flex: 1; max-height: 250px; margin-bottom: 10px; }
.layer-item { display: flex; align-items: center; justify-content: space-between; background: #3a3b3c; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; cursor: pointer; border: 1px solid transparent; }
.layer-item.active { border-color: #2e89ff; background: #2f3542; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-actions">
    <button class="icon-btn" onclick="openLayersModal()">☰ লেয়ার</button>
    <button class="icon-btn" onclick="deleteSelected()" style="color:#ff6b6b;">🗑 মুছুন</button>
  </div>
  <h1>PixelLab Studio</h1>
  <button class="icon-btn btn-save" onclick="saveImage()">💾 সেভ</button>
</div>

<div class="canvas-wrapper" id="canvasWrap">
  <canvas id="mainCanvas" width="720" height="720"></canvas>
</div>

<!-- টেক্সট প্যানেল -->
<div class="panel-drawer active" id="textPanel">
  <div class="panel-header">
    <span>টেক্সট এডিটর ও ইফেক্ট</span>
    <button class="close-panel" onclick="closeAllPanels()">✕</button>
  </div>
  <div class="btn-grid">
    <button class="action-btn" onclick="addNewText()">+ নতুন টেক্সট</button>
    <button class="action-btn" id="btnBold" onclick="toggleStyle('bold')">B বোল্ড</button>
    <button class="action-btn" id="btnItalic" onclick="toggleStyle('italic')">I ইটালিক</button>
    <button class="action-btn" id="btnUnderline" onclick="toggleStyle('underline')">U দাগ</button>
  </div>
  <div class="ctrl-row">
    <label>লেখা:</label>
    <textarea id="inpText" rows="1" oninput="updateTextProp()"></textarea>
  </div>
  <div class="ctrl-row">
    <label>সাইজ:</label>
    <input type="range" id="inpFontSize" min="15" max="150" value="45" oninput="updateTextProp()">
    <label>রং:</label>
    <input type="color" id="inpTextColor" value="#ffffff" onchange="updateTextProp()">
  </div>
  <div class="ctrl-row">
    <label>বাঁকানো (Curve):</label>
    <input type="range" id="inpCurve" min="-180" max="180" value="0" oninput="updateTextProp()">
  </div>
  <div class="ctrl-row">
    <label>৩D ইফেক্ট:</label>
    <input type="range" id="inp3d" min="0" max="15" value="0" oninput="updateTextProp()">
    <label>৩D রং:</label>
    <input type="color" id="inp3dColor" value="#000000" onchange="updateTextProp()">
  </div>
  <div class="ctrl-row">
    <label>স্ট্রোক / আউটলাইন:</label>
    <input type="range" id="inpStroke" min="0" max="15" value="0" oninput="updateTextProp()">
    <input type="color" id="inpStrokeColor" value="#000000" onchange="updateTextProp()">
  </div>
  <div class="ctrl-row">
    <label>শ্যাডো (ছায়া):</label>
    <input type="range" id="inpShadow" min="0" max="25" value="0" oninput="updateTextProp()">
    <input type="color" id="inpShadowColor" value="#000000" onchange="updateTextProp()">
  </div>
  <div class="ctrl-row">
    <label>ফন্ট:</label>
    <select id="inpFontFamily" onchange="updateTextProp()">
      <option value="'Hind Siliguri', sans-serif">বাংলা ফন্ট (Hind Siliguri)</option>
      <option value="Arial, sans-serif">Arial</option>
      <option value="Impact, sans-serif">Impact (Bold)</option>
      <option value="Georgia, serif">Georgia</option>
    </select>
  </div>
</div>

<!-- শেপ প্যানেল -->
<div class="panel-drawer" id="shapePanel">
  <div class="panel-header">
    <span>শেপ টুল</span>
    <button class="close-panel" onclick="closeAllPanels()">✕</button>
  </div>
  <div class="btn-grid">
    <button class="action-btn" onclick="addShape('rect')">আয়তক্ষেত্র</button>
    <button class="action-btn" onclick="addShape('circle')">বৃত্ত</button>
    <button class="action-btn" onclick="addShape('triangle')">ত্রিভুজ</button>
  </div>
  <div class="ctrl-row">
    <label>ভিতরের রং:</label>
    <input type="color" id="inpShapeFill" value="#2e89ff" onchange="updateShapeProp()">
  </div>
  <div class="ctrl-row">
    <label>বর্ডার রং:</label>
    <input type="color" id="inpShapeStroke" value="#ffffff" onchange="updateShapeProp()">
    <label>বর্ডার সাইজ:</label>
    <input type="number" id="inpShapeStrokeW" value="2" min="0" max="20" onchange="updateShapeProp()">
  </div>
</div>

<!-- টেবিল/ছক প্যানেল -->
<div class="panel-drawer" id="tablePanel">
  <div class="panel-header">
    <span>টেবিল / ছক টুল</span>
    <button class="close-panel" onclick="closeAllPanels()">✕</button>
  </div>
  <div class="ctrl-row">
    <label>সারি (Rows):</label>
    <input type="number" id="inpRows" value="3" min="1" max="10">
    <label>কলাম (Cols):</label>
    <input type="number" id="inpCols" value="3" min="1" max="6">
  </div>
  <div class="ctrl-row">
    <label>হেডার রং:</label>
    <input type="color" id="inpTableHeadBg" value="#2e89ff">
    <label>বডি রং:</label>
    <input type="color" id="inpTableBodyBg" value="#ffffff">
  </div>
  <div class="ctrl-row">
    <label>লেখা রং:</label>
    <input type="color" id="inpTableText" value="#000000">
    <label>বর্ডার রং:</label>
    <input type="color" id="inpTableBorder" value="#333333">
  </div>
  <div class="btn-grid" style="grid-template-columns: 1fr 1fr; margin-top: 8px;">
    <button class="action-btn active" onclick="addNewTable()">+ টেবিল বসান</button>
    <button class="action-btn" onclick="openTableEditModal()">টেক্সট এডিট</button>
  </div>
</div>

<!-- ব্যাকগ্রাউন্ড প্যানেল -->
<div class="panel-drawer" id="bgPanel">
  <div class="panel-header">
    <span>ক্যানভাস সাইজ ও ব্যাকগ্রাউন্ড</span>
    <button class="close-panel" onclick="closeAllPanels()">✕</button>
  </div>
  <div class="ctrl-row">
    <label>রং:</label>
    <input type="color" id="inpBgColor" value="#1e1e1e" onchange="updateCanvasBg()">
  </div>
  <div class="ctrl-row">
    <label>সাইজ অনুপাত:</label>
    <select id="inpCanvasRatio" onchange="changeCanvasRatio()">
      <option value="1:1">১:১ (বর্গ - Instagram / Profile)</option>
      <option value="16:9">১৬:৯ (YouTube থাম্বনেইল)</option>
      <option value="9:16">৯:১৬ (Story / Reel)</option>
      <option value="4:3">৪:৩ (পোস্টার)</option>
    </select>
  </div>
</div>

<!-- ছবি আপলোড ইনপুট -->
<input type="file" id="fileImageInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">

<!-- বটম বার -->
<div class="bottom-tabs">
  <div class="tab-item active" onclick="switchTab('textPanel', this)">
    <span class="tab-icon">T</span>
    <span>টেক্সট</span>
  </div>
  <div class="tab-item" onclick="switchTab('shapePanel', this)">
    <span class="tab-icon">⬜</span>
    <span>শেপ</span>
  </div>
  <div class="tab-item" onclick="document.getElementById('fileImageInput').click()">
    <span class="tab-icon">🖼</span>
    <span>ছবি</span>
  </div>
  <div class="tab-item" onclick="switchTab('tablePanel', this)">
    <span class="tab-icon">⊞</span>
    <span>ছক/টেবিল</span>
  </div>
  <div class="tab-item" onclick="switchTab('bgPanel', this)">
    <span class="tab-icon">🎨</span>
    <span>ব্যাকগ্রাউন্ড</span>
  </div>
</div>

<!-- লেয়ার মডাল -->
<div class="modal-overlay" id="layersModal">
  <div class="modal-box">
    <div class="modal-header">
      <span>লেয়ার তালিকা</span>
      <button class="close-panel" onclick="closeModal('layersModal')">✕</button>
    </div>
    <div class="layer-list" id="layersList"></div>
    <button class="action-btn" onclick="closeModal('layersModal')">ঠিক আছে</button>
  </div>
</div>

<!-- টেবিল এডিট মডাল -->
<div class="modal-overlay" id="tableEditModal">
  <div class="modal-box" style="max-width: 400px;">
    <div class="modal-header">
      <span>টেবিল ডাটা এডিট</span>
      <button class="close-panel" onclick="closeModal('tableEditModal')">✕</button>
    </div>
    <div class="layer-list" id="tableInputsContainer"></div>
    <button class="action-btn active" onclick="saveTableContent()">সেভ করুন</button>
  </div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

let layers = [];
let selectedLayer = null;
let nextId = 1;
let canvasBg = '#1e1e1e';
let isDragging = false;
let dragStart = { x: 0, y: 0 };

function switchTab(panelId, tabElem) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel-drawer').forEach(p => p.classList.remove('active'));
  tabElem.classList.add('active');
  const panel = document.getElementById(panelId);
  if (panel) panel.classList.add('active');
}

function closeAllPanels() {
  document.querySelectorAll('.panel-drawer').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
}

function addNewText() {
  const layer = {
    id: nextId++,
    type: 'text',
    x: canvas.width / 2 - 100,
    y: canvas.height / 2,
    text: 'আপনার লেখা',
    fontSize: 45,
    color: '#ffffff',
    fontFamily: "'Hind Siliguri', sans-serif",
    bold: false,
    italic: false,
    underline: false,
    curve: 0,
    depth3d: 0,
    color3d: '#000000',
    stroke: 0,
    strokeColor: '#000000',
    shadow: 0,
    shadowColor: '#000000'
  };
  layers.push(layer);
  selectedLayer = layer;
  syncTextPanel();
  render();
}

function syncTextPanel() {
  if (!selectedLayer || selectedLayer.type !== 'text') return;
  document.getElementById('inpText').value = selectedLayer.text;
  document.getElementById('inpFontSize').value = selectedLayer.fontSize;
  document.getElementById('inpTextColor').value = selectedLayer.color;
  document.getElementById('inpCurve').value = selectedLayer.curve;
  document.getElementById('inp3d').value = selectedLayer.depth3d;
  document.getElementById('inp3dColor').value = selectedLayer.color3d;
  document.getElementById('inpStroke').value = selectedLayer.stroke;
  document.getElementById('inpStrokeColor').value = selectedLayer.strokeColor;
  document.getElementById('inpShadow').value = selectedLayer.shadow;
  document.getElementById('inpShadowColor').value = selectedLayer.shadowColor;
  document.getElementById('inpFontFamily').value = selectedLayer.fontFamily;
}

function updateTextProp() {
  if (!selectedLayer || selectedLayer.type !== 'text') return;
  selectedLayer.text = document.getElementById('inpText').value;
  selectedLayer.fontSize = parseInt(document.getElementById('inpFontSize').value);
  selectedLayer.color = document.getElementById('inpTextColor').value;
  selectedLayer.curve = parseInt(document.getElementById('inpCurve').value);
  selectedLayer.depth3d = parseInt(document.getElementById('inp3d').value);
  selectedLayer.color3d = document.getElementById('inp3dColor').value;
  selectedLayer.stroke = parseInt(document.getElementById('inpStroke').value);
  selectedLayer.strokeColor = document.getElementById('inpStrokeColor').value;
  selectedLayer.shadow = parseInt(document.getElementById('inpShadow').value);
  selectedLayer.shadowColor = document.getElementById('inpShadowColor').value;
  selectedLayer.fontFamily = document.getElementById('inpFontFamily').value;
  render();
}

function toggleStyle(style) {
  if (!selectedLayer || selectedLayer.type !== 'text') return;
  selectedLayer[style] = !selectedLayer[style];
  render();
}

function addShape(type) {
  const layer = {
    id: nextId++,
    type: 'shape',
    shapeType: type,
    x: canvas.width / 2 - 80,
    y: canvas.height / 2 - 80,
    width: 160,
    height: 160,
    fill: document.getElementById('inpShapeFill').value,
    stroke: document.getElementById('inpShapeStroke').value,
    strokeWidth: parseInt(document.getElementById('inpShapeStrokeW').value)
  };
  layers.push(layer);
  selectedLayer = layer;
  render();
}

function updateShapeProp() {
  if (!selectedLayer || selectedLayer.type !== 'shape') return;
  selectedLayer.fill = document.getElementById('inpShapeFill').value;
  selectedLayer.stroke = document.getElementById('inpShapeStroke').value;
  selectedLayer.strokeWidth = parseInt(document.getElementById('inpShapeStrokeW').value);
  render();
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      const scale = Math.min(300 / img.width, 300 / img.height, 1);
      const layer = {
        id: nextId++,
        type: 'image',
        x: canvas.width / 2 - (img.width * scale) / 2,
        y: canvas.height / 2 - (img.height * scale) / 2,
        width: img.width * scale,
        height: img.height * scale,
        img: img
      };
      layers.push(layer);
      selectedLayer = layer;
      render();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function addNewTable() {
  const rows = parseInt(document.getElementById('inpRows').value) || 3;
  const cols = parseInt(document.getElementById('inpCols').value) || 3;
  const grid = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      row.push(r === 0 ? `হেড ${c+1}` : `ডাটা`);
    }
    grid.push(row);
  }
  const layer = {
    id: nextId++,
    type: 'table',
    x: 60,
    y: canvas.height / 2 - 100,
    width: canvas.width - 120,
    height: 180,
    rows: rows,
    cols: cols,
    data: grid,
    headBg: document.getElementById('inpTableHeadBg').value,
    bodyBg: document.getElementById('inpTableBodyBg').value,
    textColor: document.getElementById('inpTableText').value,
    borderColor: document.getElementById('inpTableBorder').value
  };
  layers.push(layer);
  selectedLayer = layer;
  render();
}

function openTableEditModal() {
  if (!selectedLayer || selectedLayer.type !== 'table') {
    alert('প্রথমে টেবিল লেয়ারটি সিলেক্ট করুন।');
    return;
  }
  const box = document.getElementById('tableInputsContainer');
  box.innerHTML = '';
  for (let r = 0; r < selectedLayer.rows; r++) {
    const rowDiv = document.createElement('div');
    rowDiv.style.display = 'flex';
    rowDiv.style.gap = '4px';
    rowDiv.style.marginBottom = '6px';
    for (let c = 0; c < selectedLayer.cols; c++) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = selectedLayer.data[r][c];
      input.id = `t_cell_${r}_${c}`;
      input.style.flex = '1';
      input.style.background = '#1c1e21';
      input.style.border = '1px solid #4e4f50';
      input.style.color = '#fff';
      input.style.padding = '4px';
      input.style.borderRadius = '4px';
      input.style.fontSize = '12px';
      rowDiv.appendChild(input);
    }
    box.appendChild(rowDiv);
  }
  openModal('tableEditModal');
}

function saveTableContent() {
  if (!selectedLayer || selectedLayer.type !== 'table') return;
  for (let r = 0; r < selectedLayer.rows; r++) {
    for (let c = 0; c < selectedLayer.cols; c++) {
      const val = document.getElementById(`t_cell_${r}_${c}`).value;
      selectedLayer.data[r][c] = val;
    }
  }
  render();
  closeModal('tableEditModal');
}

function updateCanvasBg() {
  canvasBg = document.getElementById('inpBgColor').value;
  render();
}

function changeCanvasRatio() {
  const r = document.getElementById('inpCanvasRatio').value;
  if (r === '1:1') { canvas.width = 720; canvas.height = 720; }
  else if (r === '16:9') { canvas.width = 1280; canvas.height = 720; }
  else if (r === '9:16') { canvas.width = 720; canvas.height = 1280; }
  else if (r === '4:3') { canvas.width = 800; canvas.height = 600; }
  render();
}

function render() {
  ctx.fillStyle = canvasBg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  layers.forEach(layer => {
    ctx.save();
    if (layer.type === 'text') drawTextLayer(layer);
    else if (layer.type === 'shape') drawShapeLayer(layer);
    else if (layer.type === 'image') drawImageLayer(layer);
    else if (layer.type === 'table') drawTableLayer(layer);
    ctx.restore();
  });

  if (selectedLayer) {
    const b = getBounds(selectedLayer);
    ctx.strokeStyle = '#2e89ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(b.x - 4, b.y - 4, b.w + 8, b.h + 8);
    ctx.setLineDash([]);
  }
}

function drawTextLayer(l) {
  ctx.font = `${l.italic ? 'italic ' : ''}${l.bold ? 'bold ' : ''}${l.fontSize}px ${l.fontFamily}`;
  ctx.textBaseline = 'middle';

  if (l.depth3d > 0) {
    ctx.fillStyle = l.color3d;
    for (let i = 1; i <= l.depth3d; i++) {
      renderCurvedText(l, l.x + i, l.y + i, false);
    }
  }

  if (l.shadow > 0) {
    ctx.shadowColor = l.shadowColor;
    ctx.shadowBlur = l.shadow;
    ctx.shadowOffsetX = 3;
    ctx.shadowOffsetY = 3;
  }

  if (l.stroke > 0) {
    ctx.strokeStyle = l.strokeColor;
    ctx.lineWidth = l.stroke;
    renderCurvedText(l, l.x, l.y, true);
  }

  ctx.fillStyle = l.color;
  renderCurvedText(l, l.x, l.y, false);

  if (l.underline) {
    const w = ctx.measureText(l.text).width;
    ctx.strokeStyle = l.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x, l.y + l.fontSize / 2 + 4);
    ctx.lineTo(l.x + w, l.y + l.fontSize / 2 + 4);
    ctx.stroke();
  }
}

function renderCurvedText(l, x, y, isStroke) {
  if (!l.curve || l.curve === 0) {
    if (isStroke) ctx.strokeText(l.text, x, y);
    else ctx.fillText(l.text, x, y);
    return;
  }
  const rad = (l.curve * Math.PI) / 180;
  const chars = l.text.split('');
  const totalW = ctx.measureText(l.text).width;
  const radius = totalW / rad;
  let currentAngle = -rad / 2;

  chars.forEach(c => {
    const w = ctx.measureText(c).width;
    const a = (w / totalW) * rad;
    const px = x + Math.sin(currentAngle + a / 2) * radius;
    const py = y - radius + Math.cos(currentAngle + a / 2) * radius;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(-currentAngle - a / 2);
    if (isStroke) ctx.strokeText(c, 0, 0);
    else ctx.fillText(c, 0, 0);
    ctx.restore();
    currentAngle += a;
  });
}

function drawShapeLayer(l) {
  ctx.fillStyle = l.fill;
  ctx.strokeStyle = l.stroke;
  ctx.lineWidth = l.strokeWidth;
  ctx.beginPath();
  if (l.shapeType === 'rect') {
    ctx.rect(l.x, l.y, l.width, l.height);
  } else if (l.shapeType === 'circle') {
    ctx.arc(l.x + l.width / 2, l.y + l.height / 2, l.width / 2, 0, Math.PI * 2);
  } else if (l.shapeType === 'triangle') {
    ctx.moveTo(l.x + l.width / 2, l.y);
    ctx.lineTo(l.x + l.width, l.y + l.height);
    ctx.lineTo(l.x, l.y + l.height);
    ctx.closePath();
  }
  ctx.fill();
  if (l.strokeWidth > 0) ctx.stroke();
}

function drawImageLayer(l) {
  ctx.drawImage(l.img, l.x, l.y, l.width, l.height);
}

function drawTableLayer(l) {
  const cw = l.width / l.cols;
  const ch = l.height / l.rows;
  for (let r = 0; r < l.rows; r++) {
    for (let c = 0; c < l.cols; c++) {
      const cx = l.x + c * cw;
      const cy = l.y + r * ch;
      ctx.fillStyle = r === 0 ? l.headBg : l.bodyBg;
      ctx.fillRect(cx, cy, cw, ch);
      ctx.strokeStyle = l.borderColor;
      ctx.lineWidth = 1;
      ctx.strokeRect(cx, cy, cw, ch);

      ctx.fillStyle = l.textColor;
      ctx.font = `bold ${Math.min(ch * 0.35, 16)}px 'Hind Siliguri', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(l.data[r][c] || '', cx + cw / 2, cy + ch / 2);
    }
  }
  ctx.textAlign = 'left';
}

function getBounds(l) {
  if (l.type === 'text') {
    ctx.font = `${l.fontSize}px ${l.fontFamily}`;
    const w = ctx.measureText(l.text).width;
    return { x: l.x, y: l.y - l.fontSize / 2, w: w, h: l.fontSize };
  }
  return { x: l.x, y: l.y, w: l.width, h: l.height };
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function onTouchStart(e) {
  const p = getPos(e);
  for (let i = layers.length - 1; i >= 0; i--) {
    const b = getBounds(layers[i]);
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
      selectedLayer = layers[i];
      isDragging = true;
      dragStart.x = p.x - selectedLayer.x;
      dragStart.y = p.y - selectedLayer.y;
      if (selectedLayer.type === 'text') syncTextPanel();
      render();
      return;
    }
  }
  selectedLayer = null;
  render();
}

function onTouchMove(e) {
  if (!isDragging || !selectedLayer) return;
  const p = getPos(e);
  selectedLayer.x = p.x - dragStart.x;
  selectedLayer.y = p.y - dragStart.y;
  render();
}

function onTouchEnd() { isDragging = false; }

canvas.addEventListener('mousedown', onTouchStart);
canvas.addEventListener('mousemove', onTouchMove);
window.addEventListener('mouseup', onTouchEnd);

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onTouchStart(e); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onTouchMove(e); }, { passive: false });
window.addEventListener('touchend', onTouchEnd);

function deleteSelected() {
  if (!selectedLayer) return;
  layers = layers.filter(l => l.id !== selectedLayer.id);
  selectedLayer = null;
  render();
}

function openLayersModal() {
  const box = document.getElementById('layersList');
  box.innerHTML = '';
  layers.slice().reverse().forEach(l => {
    const d = document.createElement('div');
    d.className = 'layer-item' + (l === selectedLayer ? ' active' : '');
    d.innerHTML = `<span>${l.type === 'text' ? l.text : l.type}</span>`;
    d.onclick = () => { selectedLayer = l; render(); openLayersModal(); };
    box.appendChild(d);
  });
  openModal('layersModal');
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function saveImage() {
  const temp = selectedLayer;
  selectedLayer = null;
  render();
  const a = document.createElement('a');
  a.download = 'pixellab-design.png';
  a.href = canvas.toDataURL('image/png', 1.0);
  a.click();
  selectedLayer = temp;
  render();
}

// ডিফল্ট টেক্সট লোড
document.fonts.ready.then(() => {
  addNewText();
});
</script>
</body>
</html>
